<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="TrollStore TV Architecture Overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1200" height="540" rx="18" fill="url(#bg)" stroke="#1f2937" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="48" fill="#f9fafb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="700">TrollStore TV — Architecture &amp; Cold-Reboot Signing Pipeline</text>
  <text x="40" y="74" fill="#9ca3af" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">Apple TV 4K (AppleTV14,1 · tvOS 17.0 / 21J354) · Zero dynamic_lookup · Built-in ChOma · Sealed Read-Only SSV Preserved</text>
  <rect x="40" y="88" width="1120" height="2" fill="url(#accent)" opacity="0.6"/>

  <!-- Column 1: macOS Build -->
  <rect x="40" y="115" width="300" height="315" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="40" y="115" width="300" height="36" rx="14" fill="#1e293b"/>
  <text x="58" y="139" fill="#38bdf8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">1. MACOS HOST BUILD</text>

  <rect x="58" y="168" width="264" height="62" rx="10" fill="#111827" stroke="#334155"/>
  <text x="72" y="191" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">build-libcrypto-tvos.sh</text>
  <text x="72" y="213" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">Static OpenSSL arm64 tvOS (local)</text>

  <rect x="58" y="246" width="264" height="74" rx="10" fill="#111827" stroke="#334155"/>
  <text x="72" y="269" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">build-tvos.sh (Xcode + Theos)</text>
  <text x="72" y="290" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">TrollStore.app + trollstorehelper</text>
  <text x="72" y="308" fill="#34d399" font-family="ui-monospace,monospace" font-size="11.5">0 dynamic_lookup · T8ALTGMVXN</text>

  <rect x="58" y="336" width="264" height="76" rx="10" fill="#111827" stroke="#334155"/>
  <text x="72" y="359" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">Runtime Compat Shims</text>
  <text x="72" y="380" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">TSSpawnCompat.h (persona dlsym)</text>
  <text x="72" y="398" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">TSPrivateRefs.m (6 tvOS fwks)</text>

  <!-- Arrow 1->2 -->
  <line x1="340" y1="272" x2="394" y2="272" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Column 2: On-Device RootHelper -->
  <rect x="402" y="115" width="380" height="315" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="402" y="115" width="380" height="36" rx="14" fill="#1e293b"/>
  <text x="420" y="139" fill="#38bdf8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">2. ON-DEVICE SIGN &amp; INSTALL (uid=0)</text>

  <rect x="420" y="168" width="344" height="58" rx="10" fill="#111827" stroke="#334155"/>
  <text x="434" y="191" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">TrollStore.app (uid=501) → Helper (uid=0)</text>
  <text x="434" y="212" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">Native TSTVSettingsController · persona spawn</text>

  <rect x="420" y="240" width="344" height="86" rx="10" fill="#111827" stroke="#38bdf8" stroke-opacity="0.6"/>
  <text x="434" y="263" fill="#38bdf8" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">Built-in ChOma Pipeline (No ldid)</text>
  <text x="434" y="284" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="11.5">1. Collect Info.plist entitlements (main + .appex)</text>
  <text x="434" y="301" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="11.5">2. Normalize all regular Mach-Os (skip symlinks)</text>
  <text x="434" y="318" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="11.5">3. Apply per-bundle entitlements + CoreTrust CMS</text>

  <rect x="420" y="340" width="344" height="72" rx="10" fill="#111827" stroke="#334155"/>
  <text x="434" y="363" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">MCMAppContainer + uicache</text>
  <text x="434" y="384" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">Registers into /private/var/containers/Bundle</text>
  <text x="434" y="401" fill="#34d399" font-family="ui-monospace,monospace" font-size="11.5">Zero trustcache writes · Preserves no-container</text>

  <!-- Arrow 2->3 -->
  <line x1="782" y1="272" x2="836" y2="272" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Column 3: Cold Reboot State -->
  <rect x="844" y="115" width="316" height="315" rx="14" fill="#0f172a" stroke="#065f46" stroke-width="1.5"/>
  <rect x="844" y="115" width="316" height="36" rx="14" fill="#064e3b"/>
  <text x="862" y="139" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">3. COLD-REBOOT UNJAILBROKEN</text>

  <rect x="862" y="168" width="280" height="74" rx="10" fill="#111827" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="876" y="191" fill="#34d399" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">CoreTrust Verified Launch</text>
  <text x="876" y="212" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="11.5">TeamIdentifier=T8ALTGMVXN</text>
  <text x="876" y="230" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">No jailbreak or daemon required</text>

  <rect x="862" y="256" width="280" height="78" rx="10" fill="#111827" stroke="#334155"/>
  <text x="876" y="279" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">Verified Real Apps (tvOS 17.0)</text>
  <text x="876" y="300" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">TrollStore.app · 5-Mach-O app</text>
  <text x="876" y="318" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">Kodi 21.3 (108 Mach-Os + .appex)</text>

  <rect x="862" y="348" width="280" height="64" rx="10" fill="#111827" stroke="#334155"/>
  <text x="876" y="371" fill="#f3f4f6" font-family="-apple-system,sans-serif" font-size="14" font-weight="600">Data Container Safety</text>
  <text x="876" y="392" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">Standard sandbox &amp; no-container</text>

  <!-- Bottom Safety Bar -->
  <rect x="40" y="452" width="1120" height="58" rx="12" fill="#0f172a" stroke="#334155" stroke-dasharray="6 4"/>
  <text x="60" y="477" fill="#f59e0b" font-family="ui-monospace,monospace" font-size="12.5" font-weight="700">SAFETY BOUNDARY</text>
  <text x="210" y="477" fill="#cbd5e1" font-family="-apple-system,sans-serif" font-size="13">Never modifies sealed read-only SSV /Applications · Rejects encrypted main binaries (cryptid != 0, err 180) · Skips symlinks</text>
  <text x="60" y="497" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11.5">Companion host tools: comicchang/trollstore-tv-tools (MIT)   |   Jailbreak trustcache alternative: comicchang/trollstore-lite-tv (MIT)</text>
</svg>
